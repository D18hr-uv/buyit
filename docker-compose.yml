services:
  api:
    build: ./backend
    env_file: .env          # provides DATABASE_URL (Neon Postgres) + OPENAI_API_KEY
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
